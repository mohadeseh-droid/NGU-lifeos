crates",quoteFa:"زندگی بررسی‌نشده ارزش زیستن ندارد.",authorFa:"سقراط"},{quote:"Happiness is not something ready made. It comes from your own actions.",author:"Dalai Lama",quoteFa:"خوشبختی چیزی آماده نیست. از اعمال خودتان می‌آید.",authorFa:"دالایی لاما"},{quote:"Do what you can, with what you have, where you are.",author:"Theodore Roosevelt",quoteFa:"با آنچه دارید، در جایی که هستید، آنچه می‌توانید انجام دهید.",authorFa:"تئودور روزولت"},{quote:"It does not matter how slowly you go as long as you do not stop.",author:"Confucius",quoteFa:"مهم نیست چقدر آهسته پیش می‌روید، تا زمانی که متوقف نشوید.",authorFa:"کنفوسیوس"},{quote:"You miss 100% of the shots you don't take.",author:"Wayne Gretzky",quoteFa:"۱۰۰٪ ضربه‌هایی که نمی‌زنید را از دست می‌دهید.",authorFa:"وین گرتزکی"},{quote:"The future belongs to those who believe in the beauty of their dreams.",author:"Eleanor Roosevelt",quoteFa:"آینده از آن کسانی است که به زیبایی رؤیاهایشان باور دارند.",authorFa:"النور روزولت"},{quote:"Life is what happens when you're busy making other plans.",author:"John Lennon",quoteFa:"زندگی همان چیزی است که وقتی مشغول برنامه‌ریزی برای چیزهای دیگر هستید رخ می‌دهد.",authorFa:"جان لنون"},{quote:"In the middle of difficulty lies opportunity.",author:"Albert Einstein",quoteFa:"در میان دشواری، فرصت نهفته است.",authorFa:"آلبرت اینشتین"},{quote:"It always seems impossible until it's done.",author:"Nelson Mandela",quoteFa:"همیشه غیرممکن به نظر می‌رسد تا زمانی که انجام شود.",authorFa:"نلسون ماندلا"},{quote:"Start where you are. Use what you have. Do what you can.",author:"Arthur Ashe",quoteFa:"از جایی که هستید شروع کنید. از آنچه دارید استفاده کنید. آنچه می‌توانید انجام دهید.",authorFa:"آرتور اش"},{quote:"The two most important days in your life are the day you are born and the day you find out why.",author:"Mark Twain",quoteFa:"دو مهم‌ترین روز زندگی شما، روزی است که به دنیا می‌آیید و روزی که دلیلش را می‌فهمید.",authorFa:"مارک تواین"},{quote:"What we fear of doing most is usually what we most need to do.",author:"Tim Ferriss",quoteFa:"آنچه بیشتر از انجامش می‌ترسیم، معمولاً همان چیزی است که بیشترین نیاز را به انجامش داریم.",authorFa:"تیم فریس"},{quote:"You are never too old to set another goal or to dream a new dream.",author:"C.S. Lewis",quoteFa:"هرگز برای تعیین هدفی جدید یا دیدن رؤیایی تازه، پیر نیستید.",authorFa:"سی. اس. لوئیس"},{quote:"The only limit to our realization of tomorrow is our doubts of today.",author:"Franklin D. Roosevelt",quoteFa:"تنها محدودیت تحقق فردای ما، تردیدهای امروز ماست.",authorFa:"فرانکلین روزولت"},{quote:"Courage is not the absence of fear, but the triumph over it.",author:"Nelson Mandela",quoteFa:"شجاعت نبود ترس نیست، پیروزی بر آن است.",authorFa:"نلسون ماندلا"},{quote:"Great things never come from comfort zones.",author:"Unknown",quoteFa:"چیزهای بزرگ هرگز از منطقه آسایش نمی‌آیند.",authorFa:"ناشناس"},{quote:"Dream big and dare to fail.",author:"Norman Vaughan",quoteFa:"رؤیای بزرگ داشته باشید و جسارت شکست را پیدا کنید.",authorFa:"نورمن وان"},{quote:"If opportunity doesn't knock, build a door.",author:"Milton Berle",quoteFa:"اگر فرصت در نمی‌زند، دری بسازید.",authorFa:"میلتون برل"},{quote:"Don't watch the clock; do what it does. Keep going.",author:"Sam Levenson",quoteFa:"به ساعت نگاه نکنید؛ کاری که آن می‌کند را انجام دهید. ادامه دهید.",authorFa:"سام لونسون"},{quote:"The harder you work for something, the greater you'll feel when you achieve it.",author:"Unknown",quoteFa:"هرچه سخت‌تر برای چیزی تلاش کنید، هنگام رسیدن به آن احساس بهتری خواهید داشت.",authorFa:"ناشناس"},{quote:"Don't be afraid to give up the good to go for the great.",author:"John D. Rockefeller",quoteFa:"نترسید از رها کردن خوب برای رسیدن به عالی.",authorFa:"جان دی. راکفلر"},{quote:"A goal without a plan is just a wish.",author:"Antoine de Saint-Exupéry",quoteFa:"هدف بدون برنامه فقط یک آرزوست.",authorFa:"آنتوان دو سنت اگزوپری"},{quote:"Discipline is the bridge between goals and accomplishment.",author:"Jim Rohn",quoteFa:"نظم، پل میان اهداف و دستاوردهاست.",authorFa:"جیم ران"},{quote:"Either you run the day or the day runs you.",author:"Jim Rohn",quoteFa:"یا شما روز را می‌چرخانید یا روز شما را می‌چرخاند.",authorFa:"جیم ران"},{quote:"Motivation is what gets you started. Habit is what keeps you going.",author:"Jim Ryun",quoteFa:"انگیزه شما را شروع می‌کند. عادت شما را ادامه می‌دهد.",authorFa:"جیم رایون"},{quote:"The way to get started is to quit talking and begin doing.",author:"Walt Disney",quoteFa:"راه شروع کردن، دست کشیدن از حرف زدن و آغاز عمل است.",authorFa:"والت دیزنی"},{quote:"Don't let yesterday take up too much of today.",author:"Will Rogers",quoteFa:"نگذارید دیروز، امروز شما را بیش از حد بگیرد.",authorFa:"ویل راجرز"},{quote:"You learn more from failure than from success. Don't let it stop you. Failure builds character.",author:"Unknown",quoteFa:"از شکست بیشتر از موفقیت یاد می‌گیرید. نگذارید متوقف‌تان کند. شکست شخصیت می‌سازد.",authorFa:"ناشناس"},{quote:"If you are working on something that you really care about, you don't have to be pushed. The vision pulls you.",author:"Steve Jobs",quoteFa:"اگر روی چیزی کار می‌کنید که واقعاً برایتان مهم است، نیازی به هل داده شدن ندارید. چشم‌انداز شما را می‌کشد.",authorFa:"استیو جابز"},{quote:"People who are crazy enough to think they can change the world are the ones who do.",author:"Rob Siltanen",quoteFa:"افرادی که آنقدر دیوانه‌اند که فکر می‌کنند می‌توانند جهان را تغییر دهند، همان‌هایی هستند که تغییرش می‌دهند.",authorFa:"راب سیلتانن"},{quote:"Failure will never overtake me if my determination to succeed is strong enough.",author:"Og Mandino",quoteFa:"اگر عزم من برای موفقیت به قدر کافی قوی باشد، شکست هرگز به من نمی‌رسد.",authorFa:"اگ ماندینو"},{quote:"We may encounter many defeats but we must not be defeated.",author:"Maya Angelou",quoteFa:"ممکن است شکست‌های بسیاری بخوریم، اما نباید شکست بخوریم.",authorFa:"مایا آنجلو"},{quote:"Knowing is not enough; we must apply. Wishing is not enough; we must do.",author:"Johann Wolfgang von Goethe",quoteFa:"دانستن کافی نیست؛ باید به کار بست. خواستن کافی نیست؛ باید انجام داد.",authorFa:"یوهان ولفگانگ فون گوته"},{quote:"The man who has confidence in himself gains the confidence of others.",author:"Hasidic Proverb",quoteFa:"کسی که به خودش اعتماد دارد، اعتماد دیگران را جلب می‌کند.",authorFa:"ضرب‌المثل حسیدی"},{quote:"Innovation distinguishes between a leader and a follower.",author:"Steve Jobs",quoteFa:"نوآوری میان رهبر و پیرو تفاوت ایجاد می‌کند.",authorFa:"استیو جابز"},{quote:"The only place where success comes before work is in the dictionary.",author:"Vidal Sassoon",quoteFa:"تنها جایی که موفقیت قبل از کار می‌آید، در فرهنگ لغت است.",authorFa:"ویدال ساسون"},{quote:"I find that the harder I work, the more luck I seem to have.",author:"Thomas Jefferson",quoteFa:"متوجه شده‌ام هرچه سخت‌تر کار می‌کنم، به نظر می‌رسد شانس بیشتری دارم.",authorFa:"توماس جفرسون"},{quote:"Opportunities don't happen. You create them.",author:"Chris Grosser",quoteFa:"فرصت‌ها اتفاق نمی‌افتند. شما آن‌ها را می‌سازید.",authorFa:"کریس گراسر"},{quote:"Don't count the days, make the days count.",author:"Muhammad Ali",quoteFa:"روزها را نشمارید، روزها را به حساب آورید.",authorFa:"محمد علی"},{quote:"It's not whether you get knocked down, it's whether you get up.",author:"Vince Lombardi",quoteFa:"مسئله این نیست که زمین می‌خورید یا نه، مسئله این است که بلند می‌شوید یا نه.",authorFa:"وینس لومباردی"},{quote:"If you want to lift yourself up, lift up someone else.",author:"Booker T. Washington",quoteFa:"اگر می‌خواهید خودتان را بالا ببرید، کس دیگری را بالا ببرید.",authorFa:"بوکر تی. واشینگتن"},{quote:"Believe you can and you're halfway there.",author:"Theodore Roosevelt",quoteFa:"باور کنید که می‌توانید و نیمی از راه را رفته‌اید.",authorFa:"تئودور روزولت"},{quote:"Your limitation—it's only your imagination.",author:"Unknown",quoteFa:"محدودیت شما — تنها تخیل شماست.",authorFa:"ناشناس"},{quote:"Push yourself, because no one else is going to do it for you.",author:"Unknown",quoteFa:"خودتان را به جلو برانید، چون هیچ‌کس دیگری این کار را برایتان نخواهد کرد.",authorFa:"ناشناس"},{quote:"Sometimes later becomes never. Do it now.",author:"Unknown",quoteFa:"گاهی بعداً هرگز می‌شود. همین حالا انجامش دهید.",authorFa:"ناشناس"},{quote:"Everything you've ever wanted is on the other side of fear.",author:"George Addair",quoteFa:"هر چیزی که تا حالا خواسته‌اید، آن طرف ترس است.",authorFa:"جرج اَدر"},{quote:"The best time to plant a tree was 20 years ago. The second best time is now.",author:"Chinese Proverb",quoteFa:"بهترین زمان کاشتن درخت، ۲۰ سال پیش بود. دومین بهترین زمان، حالاست.",authorFa:"ضرب‌المثل چینی"},{quote:"You don't have to be great to start, but you have to start to be great.",author:"Zig Ziglar",quoteFa:"لازم نیست برای شروع عالی باشید، اما باید شروع کنید تا عالی شوید.",authorFa:"زیگ زیگلار"},{quote:"Fall seven times, stand up eight.",author:"Japanese Proverb",quoteFa:"هفت بار بیفت، هشت بار برخیز.",authorFa:"ضرب‌المثل ژاپنی"},{quote:"The difference between ordinary and extraordinary is that little extra.",author:"Jimmy Johnson",quoteFa:"تفاوت میان معمولی و فوق‌العاده، همان کمیِ اضافه است.",authorFa:"جیمی جانسون"},{quote:"Do not wait to strike till the iron is hot; but make it hot by striking.",author:"William Butler Yeats",quoteFa:"منتظر نمان تا آهن داغ شود؛ با کوبیدن آن را داغ کن.",authorFa:"ویلیام باتلر ییتس"},{quote:"The only impossible journey is the one you never begin.",author:"Tony Robbins",quoteFa:"تنها سفر غیرممکن، سفری است که هرگز آغاز نمی‌کنی.",authorFa:"تونی رابینز"},{quote:"Hardships often prepare ordinary people for an extraordinary destiny.",author:"C.S. Lewis",quoteFa:"سختی‌ها اغلب افراد عادی را برای سرنوشتی فوق‌العاده آماده می‌کنند.",authorFa:"سی. اس. لوئیس"},{quote:"The measure of intelligence is the ability to change.",author:"Albert Einstein",quoteFa:"میزان هوش، توانایی تغییر کردن است.",authorFa:"آلبرت اینشتین"},{quote:"What you get by achieving your goals is not as important as what you become by achieving your goals.",author:"Zig Ziglar",quoteFa:"آنچه با رسیدن به اهدافتان به دست می‌آورید، به اندازه آنچه تبدیل می‌شوید مهم نیست.",authorFa:"زیگ زیگلار"},{quote:"Happiness is not the absence of problems, it's the ability to deal with them.",author:"Steve Maraboli",quoteFa:"خوشبختی نبود مشکل نیست، توانایی مقابله با آن‌هاست.",authorFa:"استیو مارابولی"},{quote:"Act as if what you do makes a difference. It does.",author:"William James",quoteFa:"طوری عمل کن که گویی کارت تفاوت ایجاد می‌کند. واقعاً می‌کند.",authorFa:"ویلیام جیمز"},{quote:"You can't use up creativity. The more you use, the more you have.",author:"Maya Angelou",quoteFa:"خلاقیت تمام‌شدنی نیست. هرچه بیشتر استفاده کنید، بیشتر دارید.",authorFa:"مایا آنجلو"},{quote:"Life isn't about finding yourself. Life is about creating yourself.",author:"George Bernard Shaw",quoteFa:"زندگی درباره پیدا کردن خودت نیست، درباره ساختن خودت است.",authorFa:"جرج برنارد شاو"},{quote:"The man who moves a mountain begins by carrying away small stones.",author:"Confucius",quoteFa:"کسی که کوهی را جابه‌جا می‌کند، با برداشتن سنگ‌های کوچک شروع می‌کند.",authorFa:"کنفوسیوس"},{quote:"A ship in harbor is safe, but that is not what ships are built for.",author:"John A. Shedd",quoteFa:"کشتی در بندر امن است، اما برای این ساخته نشده است.",authorFa:"جان اِ. شد"},{quote:"If you're going through hell, keep going.",author:"Winston Churchill",quoteFa:"اگر از جهنم می‌گذری، ادامه بده.",authorFa:"وینستون چرچیل"},{quote:"The best revenge is massive success.",author:"Frank Sinatra",quoteFa:"بهترین انتقام، موفقیت عظیم است.",authorFa:"فرانک سیناترا"},{quote:"You only live once, but if you do it right, once is enough.",author:"Mae West",quoteFa:"فقط یک بار زندگی می‌کنی، اما اگر درست زندگی کنی، یک بار کافی است.",authorFa:"می وست"},{quote:"Don't let the noise of others' opinions drown out your own inner voice.",author:"Steve Jobs",quoteFa:"نگذارید سروصدای نظرات دیگران، صدای درون خودتان را غرق کند.",authorFa:"استیو جابز"},{quote:"To be yourself in a world that is constantly trying to make you something else is the greatest accomplishment.",author:"Ralph Waldo Emerson",quoteFa:"خودت بودن در د   function placePanel() {
    if (!iconBtn || !document.body.contains(iconBtn)) return;
    var r = iconBtn.getBoundingClientRect();
    var w = Math.min(270, window.innerWidth - 16);
    panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
    panel.style.top = (r.bottom + 6) + 'px';
  }

  function togglePanel(force) {
    var open = force !== undefined ? force : panel.style.display === 'none';
    if (open) { relabel(); panel.style.display = 'block'; placePanel(); }
    else { panel.style.display = 'none'; }
  }

  function buildUI() {
    panel = document.createElement('div');
    panel.style.cssText = 'display:none;position:fixed;z-index:60;width:270px;max-width:calc(100vw - 16px);' +
      'max-height:60vh;overflow:auto;padding:12px;border-radius:12px;background:#fff;color:#222;' +
      'box-shadow:0 4px 16px rgba(0,0,0,.25);font:13px system-ui,sans-serif;';
    syncBtn = document.createElement('button'); offBtn = document.createElement('button');
    [syncBtn, offBtn].forEach(function (b) {
      b.type = 'button';
      b.style.cssText = 'margin-inline-end:8px;padding:6px 10px;border:1px solid #ccc;border-radius:8px;background:#f6f6f6;cursor:pointer;';
    });
    statusEl = document.createElement('div'); statusEl.style.cssText = 'margin:8px 0;font-size:12px;';
    headEl = document.createElement('div'); headEl.style.cssText = 'font-weight:700;font-size:12px;margin-top:6px;';
    listEl = document.createElement('ul'); listEl.style.cssText = 'padding-inline-start:16px;margin:4px 0 0;font-size:12px;';
    panel.append(syncBtn, offBtn, statusEl, headEl, listEl);
    document.body.appendChild(panel);

    iconBtn = document.createElement('button');
    iconBtn.type = 'button';
    iconBtn.setAttribute('data-gcal', '1');
    iconBtn.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;' +
      'padding:0;border:0;border-radius:8px;background:transparent;cursor:pointer;';
    iconBtn.innerHTML = ICON;
    iconBtn.addEventListener('click', function (e) { e.stopPropagation(); togglePanel(); });
    relabel();

    syncBtn.addEventListener('click', sync);
    offBtn.addEventListener('click', disconnect);
    document.addEventListener('click', function (e) {
      if (panel.style.display !== 'none' && !panel.contains(e.target) && !iconBtn.contains(e.target)) togglePanel(false);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') togglePanel(false); });
    window.addEventListener('resize', function () { togglePanel(false); });

    attach();
    // The app is rendered by React and can re-create the sidebar (e.g. language switch),
    // so re-attach the icon whenever it goes missing.
    var queued = false;
    new MutationObserver(function () {
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () { queued = false; attach(); });
    }).observe(document.body, { childList: true, subtree: true });
  }

  // Put the icon first in the little controls group beside the month name (before the < > arrows).
  function attach() {
    if (!iconBtn || document.body.contains(iconBtn)) return;
    var monthBtn = document.querySelector(MONTH_BTN);
    if (!monthBtn || !monthBtn.parentElement) return;
    var controls = monthBtn.parentElement.lastElementChild;
    if (!controls || controls === monthBtn) return;
    controls.insertBefore(iconBtn, controls.firstChild);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', buildUI);
  else buildUI();
})();
</script>
